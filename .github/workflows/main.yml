
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run tests (if applicable)
        run: npm test  # Замените на свои собственные тесты, если они есть

      - name: Build and deploy
        run: |
          npm run build  # Если требуется сборка проекта
          npm start &    # Запуск приложения в фоновом режиме
          echo "Application deployed!"
